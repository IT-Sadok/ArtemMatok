name: CI/CD Pipeline for BookingWebApi

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj

      # Build project
      - name: Build project
        run: dotnet build BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj --no-restore --configuration Release

      # Publish project
      - name: Publish project
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj --configuration Release --output ./publish

      # Zip published output
      - name: Zip published files
        run: zip -r BookingWebApi.zip ./publish

      # Create S3 bucket (if not exists)
      - name: Create S3 bucket
        run: |
          aws s3api create-bucket --bucket booking-webapi-deployments --region us-east-2 --create-bucket-configuration LocationConstraint=us-east-2 || echo "Bucket already exists"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Deploy to AWS Elastic Beanstalk
      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "booking-webapi"
          environment_name: "Development"
          region: "us-east-2"
          version_label: ${{ github.sha }}
          deployment_package: "BookingWebApi.zip"
          existing_bucket_name: "booking-webapi-deployments"
