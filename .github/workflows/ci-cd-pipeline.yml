name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      # Build the project
      - name: Build project
        run: dotnet build BookingProject/BookingWebAPI/BookingWebAPI.sln --no-restore --configuration Release

      # Run tests
      - name: Run tests
        run: |
          dotnet test BookingProject/BookingWebAPI/BookingWebAPI.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=TestResults.trx"

      # Package application for Elastic Beanstalk
      - name: Publish application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebAPI.sln --configuration Release --output ./publish

      # Zip published files for Elastic Beanstalk
      - name: Zip deployment package
        run: zip -r deployment.zip ./publish

      # Deploy to AWS Elastic Beanstalk
      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          application_name: "booking-webapi" # Your Elastic Beanstalk application name
          environment_name: "Development"   # Your Elastic Beanstalk environment name
          region: "us-east-2"               # AWS region
          version_label: ${{ github.run_id }} # Unique version label
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          deployment_package: deployment.zip
