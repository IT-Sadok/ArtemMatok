name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
      - feature/ci-cd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Install .NET Core
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0 # Оновлено до 8.0, якщо це потрібно для вашого проекту

      # Install AWS CLI
      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      # Build and publish the application
      - name: Publish Application
        run: |
          dotnet publish BookingProject/BookingWebAPI/BookingWebAPI.sln --configuration Release -r linux-x64 --self-contained true --output ./publish

      # Verify runtimeconfig.json
      - name: Verify runtimeconfig.json
        run: |
          if [ ! -f ./publish/BookingWebApi.runtimeconfig.json ]; then
            echo "Error: runtimeconfig.json file is missing!"
            exit 1
          fi

      # Rename runtimeconfig.json
      - name: Rename runtimeconfig.json
        run: mv ./publish/BookingWebApi.runtimeconfig.json ./publish/runtimeconfig.json

      # Create deployment package
      - name: Create deployment package
        run: zip -r deploy-package.zip ./publish

      # Configure AWS CLI
      - name: Configure AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
        run: aws configure set region us-east-2

      # Upload to S3
      - name: Upload to S3
        run: |
          aws s3 cp deploy-package.zip s3://your-s3-bucket-name/deploy-package.zip

      # Verify S3 Upload
      - name: Verify S3 Upload
        run: |
          aws s3 ls s3://your-s3-bucket-name/deploy-package.zip || { echo "S3 upload verification failed!"; exit 1; }

      # Create Elastic Beanstalk application version
      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "BookingWebApi" \
            --version-label $GITHUB_SHA \
            --source-bundle S3Bucket="your-s3-bucket-name",S3Key="deploy-package.zip"

      # Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "BookingWebApi" \
            --environment-name "Development" \
            --version-label $GITHUB_SHA
