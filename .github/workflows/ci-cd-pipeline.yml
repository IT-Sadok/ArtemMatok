name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      - name: Publish application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebAPI.sln --configuration Release -r linux-x64 --self-contained true --output ./publish

      - name: Verify runtimeconfig.json
        run: |
          if [ ! -f ./publish/BookingWebApi.runtimeconfig.json ]; then
            echo "Error: runtimeconfig.json file is missing!"
            exit 1
          fi

      - name: Rename runtimeconfig.json
        run: mv ./publish/BookingWebApi.runtimeconfig.json ./publish/runtimeconfig.json

      - name: Create deployment package
        run: zip -r deploy-package.zip ./publish

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        run: |
          aws s3 cp deploy-package.zip s3://elasticbeanstalk-us-east-2-127214158843/deploy-package.zip

      - name: Verify S3 Upload
        run: |
          aws s3 ls s3://elasticbeanstalk-us-east-2-127214158843/deploy-package.zip || { echo "S3 upload verification failed!"; exit 1; }

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "booking-webapi" \
            --version-label "${{ github.run_number }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-2-127214158843",S3Key="deploy-package.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "booking-webapi" \
            --environment-name "Development" \
            --version-label "${{ github.run_number }}"
