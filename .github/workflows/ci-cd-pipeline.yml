name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонування репозиторію
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Налаштування .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      # 3. Відновлення залежностей
      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      # 4. Публікація додатку
      - name: Build and Publish Application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj --configuration Release --output ./publish

      # 5. Перевірка наявності файлу runtimeconfig.json
      - name: Ensure runtimeconfig.json is present
        run: ls ./publish/*.runtimeconfig.json

      # 6. Діагностика опублікованих файлів
      - name: Debug published files
        run: ls -R ./publish

      # 7. Архівування опублікованих файлів
      - name: Zip published files
        run: zip -r BookingWebApi.zip ./publish

      # 8. Діагностика вмісту ZIP-файлу
      - name: Debug ZIP contents
        run: unzip -l BookingWebApi.zip

      # 9. Налаштування AWS облікових даних
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload Artifact to S3
        run: aws s3 cp BookingWebApi.zip s3://elasticbeanstalk-us-east-2-127214158843/booking-webapi/AWSDeploymentArchive_booking-webapi_v-${{ github.run_id }}.zip


      - name: Create Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name booking-webapi \
            --version-label "v-${{ github.run_id }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-2-127214158843",S3Key="booking-webapi/AWSDeploymentArchive_booking-webapi_v-${{ github.run_id }}.zip"

      # 12. Деплой нової версії на Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name Development \
            --version-label "v-${{ github.run_id }}"

      # 13. Перевірка статусу деплойменту
      - name: Verify Deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name booking-webapi \
            --environment-names Development
