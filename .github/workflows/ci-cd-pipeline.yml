name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
      - feature/ci-cd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Install .NET Core
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      # Install or Update AWS CLI
      - name: Install or Update AWS CLI
        run: |
          if ! command -v aws &> /dev/null; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -o awscliv2.zip
            sudo ./aws/install
          else
            echo "AWS CLI is already installed. Updating..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -o awscliv2.zip
            sudo ./aws/install --update
          fi

      # Build and publish the application
      - name: Publish Application
        run: |
          cd BookingProject/BookingWebAPI
          dotnet publish BookingWebAPI.sln -c Release -o ./publish

      # Create deployment package
      - name: Create Deployment Package
        run: |
          cd BookingProject/BookingWebAPI/publish
          zip -r deploy-package.zip ./

      # Deploy to AWS Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
        run: |
          # Завантаження пакета до S3
          aws s3 cp BookingProject/BookingWebAPI/publish/deploy-package.zip s3://elasticbeanstalk-us-east-2-127214158843/deploy-package.zip

          # Створення нової версії додатка
          aws elasticbeanstalk create-application-version \
            --application-name BookingWebApi \
            --version-label $GITHUB_SHA \
            --source-bundle S3Bucket=elasticbeanstalk-us-east-2-127214158843,S3Key=deploy-package.zip

          # Додавання затримки для реєстрації версії
          echo "Waiting for Elastic Beanstalk to process the application version..."
          sleep 30

          # Оновлення середовища
          aws elasticbeanstalk update-environment \
            --application-name BookingWebApi \
            --environment-name Development \
            --version-label $GITHUB_SHA
