name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      - name: Build and Publish Application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj --configuration Release --output ./publish

      - name: Debug published files
        run: grep -R "Test" ./publish

      - name: Zip published files
        run: zip -r BookingWebApi.zip ./publish

      - name: Debug ZIP contents
        run: unzip -l BookingWebApi.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload Artifact to S3
        run: aws s3 cp BookingWebApi.zip s3://elasticbeanstalk-us-east-2-127214158843/BookingWebApi.zip

      - name: Create Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name booking-webapi \
            --version-label "v-${{ github.run_id }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-2-127214158843",S3Key="BookingWebApi.zip"
      
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name Development \
            --version-label "v-${{ github.run_id }}"
      
      - name: Verify Deployment
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name booking-webapi \
            --environment-names Development

