name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj

      - name: Build project
        run: dotnet build BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj --no-restore --configuration Release

      - name: Publish application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebApi/BookingWebApi.csproj --configuration Release --runtime linux-x64 --self-contained true --output ./publish

      - name: Validate publish output
        run: |
          echo "Validating publish output..."
          ls -la ./publish
          if [ ! -f ./publish/BookingWebApi.dll ]; then
            echo "Error: BookingWebApi.dll is missing."
            exit 1
          fi
          if [ ! -f ./publish/BookingWebApi.runtimeconfig.json ]; then
            echo "Error: runtimeconfig.json is missing."
            exit 1
          fi

      - name: Zip deployment package
        run: zip -r deployment.zip ./publish/*

      - name: Validate deployment package
        run: |
          echo "Validating deployment package..."
          unzip -l deployment.zip
          if ! unzip -l deployment.zip | grep -q 'BookingWebApi.dll'; then
            echo "Error: BookingWebApi.dll is missing in the zip package."
            exit 1
          fi
          if ! unzip -l deployment.zip | grep -q 'runtimeconfig.json'; then
            echo "Error: runtimeconfig.json is missing in the zip package."
            exit 1
          fi

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          application_name: "booking-webapi"
          environment_name: "Development"
          region: "us-east-2"
          version_label: ${{ github.run_id }}
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          deployment_package: deployment.zip
