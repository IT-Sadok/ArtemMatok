name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup .NET environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      # Build the project
      - name: Build project
        run: dotnet build BookingProject/BookingWebAPI/BookingWebAPI.sln --no-restore --configuration Release

      # Run tests
      - name: Run Tests
        run: |
          dotnet test BookingProject/BookingWebAPI/BookingWebAPI.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=BookingWebApi.Tests/TestResults/TestResults.trx" \
            --results-directory BookingWebApi.Tests/TestResults

      # Publish the application
      - name: Publish application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebAPI.sln --configuration Release --output ./publish

      # Verify published files
      - name: List published files
        run: ls -R ./publish

      # Create a deployment package
      - name: Create deployment package
        run: zip -r deploy-package.zip ./publish

      # Configure AWS CLI
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Upload the deployment package to S3
      - name: Upload to S3
        run: |
          aws s3 cp deploy-package.zip s3://elasticbeanstalk-us-east-2-127214158843/deploy-package.zip

      # Verify S3 Upload
      - name: Verify S3 Upload
        run: |
          aws s3 ls s3://elasticbeanstalk-us-east-2-127214158843/deploy-package.zip

      # Create a new Elastic Beanstalk application version
      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "booking-webapi" \
            --version-label "${{ github.run_number }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-2-127214158843",S3Key="deploy-package.zip"

      # Update the Elastic Beanstalk environment
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "Development" \
            --version-label "${{ github.run_number }}"
