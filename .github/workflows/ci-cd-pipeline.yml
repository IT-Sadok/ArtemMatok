name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      - name: Build project
        run: dotnet build BookingProject/BookingWebAPI/BookingWebAPI.sln --no-restore --configuration Release

      - name: Publish application
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebAPI.sln --configuration Release --runtime linux-x64 --self-contained false --output ./publish

      - name: Validate publish output
        run: ls -la ./publish

      - name: Zip deployment package
        run: zip -r deployment.zip ./publish/*

      - name: Validate deployment package
        run: unzip -l deployment.zip

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          application_name: "booking-webapi"
          environment_name: "Development"
          region: "us-east-2"
          version_label: ${{ github.run_id }}
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          deployment_package: deployment.zip
