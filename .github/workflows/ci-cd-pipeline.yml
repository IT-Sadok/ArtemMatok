name: CI/CD to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
      - feature/ci-cd

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore dependencies
        run: dotnet restore BookingProject/BookingWebAPI/BookingWebAPI.sln

      - name: Build project
        run: dotnet publish BookingProject/BookingWebAPI/BookingWebAPI.sln -c Release -o ./publish

      - name: Archive the build artifacts
        run: zip -r BookingWebAPI.zip ./publish

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        run: |
          aws s3 cp BookingWebAPI.zip s3://elasticbeanstalk-us-east-2-127214158843/booking-webapi/AWSDeploymentArchive_bookingwebapi.zip

      - name: Deploy to AWS Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name BookingWebAPI \
            --version-label v-${{ github.run_number }} \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-2-127214158843",S3Key="booking-webapi/AWSDeploymentArchive_bookingwebapi.zip"
          aws elasticbeanstalk update-environment \
            --environment-name Development \
            --version-label v-${{ github.run_number }}

      - name: Confirm deployment success
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names Development \
            --query "Environments[0].Status" --output text
